name: Daily Post

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 07:00 SAST (morning post)
    - cron: '0 16 * * *'  # 16:00 UTC = 18:00 SAST (evening post)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Dry run (skip Facebook posting)'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check queue size
        run: python main.py queue

      - name: Post next video
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python main.py post --test
          else
            python main.py post
          fi

      - name: Commit queue state and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ remotion/public/audio/ remotion/public/scenes/ --force
          git diff --staged --quiet || git commit -m "chore: post + cleanup posted files [skip ci]"
          git push

      - name: Upload post log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-log-${{ github.run_id }}
          path: output/final/post_*.json
          retention-days: 30

      - name: Alert on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL_USER }}
          password: ${{ secrets.ALERT_EMAIL_PASS }}
          to: ${{ secrets.ALERT_EMAIL_USER }}
          from: PawFacts Pipeline
          subject: "FAILED: Daily Post - ${{ github.run_id }}"
          body: |
            The Daily Post workflow failed. A video was NOT posted today.

            Run ID: ${{ github.run_id }}
            Branch: ${{ github.ref_name }}

            View the failed run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
