name: Daily Post

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 07:00 SAST (morning post)
    - cron: '0 16 * * *'  # 16:00 UTC = 18:00 SAST (evening post)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Dry run (skip all posting)'
        required: false
        default: 'false'
      ig_only:
        description: 'Post to Instagram only (skip Facebook)'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: repo-state-writes
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh FB token before posting
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py refresh-token || echo "Token refresh failed — continuing with existing token"

      - name: Check queue size
        run: python main.py queue

      - name: Post next video
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python main.py post --test
          elif [ "${{ github.event.inputs.ig_only }}" = "true" ]; then
            python main.py post --ig-only
          else
            python main.py post
          fi

      - name: Commit queue state and cleanup
        run: |
          python3 -c "from modules.queue_manager import purge_stale; n=purge_stale(); print(f'Purged {n} stale manifests')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/
          if git diff --staged --quiet; then
            echo "No queue state changes to commit"
            exit 0
          fi
          git commit -m "chore: post + cleanup posted files [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push failed on attempt $attempt; retrying after rebase"
            sleep 5
          done
          echo "Failed to persist post queue state after 3 attempts"
          exit 1

      - name: Upload post log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: post-log-${{ github.run_id }}
          path: output/final/post_*.json
          retention-days: 30
