name: Daily Post

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 07:00 SAST (morning post)
    - cron: '0 16 * * *'  # 16:00 UTC = 18:00 SAST (evening post)
  workflow_run:
    # Post immediately after a fresh batch lands so the new videos start
    # draining right away — removes the dependency on cron timing for the
    # weekly queue-empty → batch-commit handoff (avoids wasted post slots).
    workflows: ["Weekly Batch Generate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Dry run (skip all posting)'
        required: false
        default: 'false'
      ig_only:
        description: 'Post to Instagram only (skip Facebook)'
        required: false
        default: 'false'

jobs:
  post:
    # When triggered by the batch workflow completing, only proceed if the
    # batch actually succeeded (otherwise there are no new videos to post).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: repo-state-writes
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Always post from the latest main so a batch-triggered run sees the
          # videos the batch just committed (workflow_run defaults to a stale SHA).
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh FB token before posting
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py refresh-token || echo "Token refresh failed — continuing with existing token"

      - name: Check queue size
        run: python main.py queue

      - name: Post next video
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python main.py post --test
          elif [ "${{ github.event.inputs.ig_only }}" = "true" ]; then
            python main.py post --ig-only
          else
            python main.py post
          fi

      - name: Commit queue state and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ── PHASE 1: commit the manifest (status=posted) atomically ──────────
          # This is the duplicate-prevention commit. If this push lands, the next
          # run will see status=posted and skip — even if phase 2 fails entirely.
          git add -A output/queue/
          if ! git diff --staged --quiet; then
            git commit -m "chore: mark posted [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                echo "Manifest committed (attempt $attempt)"
                break
              fi
              echo "Manifest push failed attempt $attempt; retrying..."
              sleep 5
            done
          fi

          # ── PHASE 2: commit the file cleanup (best-effort, non-fatal) ────────
          # Purge old manifests, then commit deleted mp4/jpg/mp3/png.
          # remotion/public/{audio,scenes} are gitignored but contain tracked
          # files committed by batch-generate — use -f and --cached rm to handle.
          python3 -c "from modules.queue_manager import purge_stale; n=purge_stale(); print(f'Purged {n} stale manifests')"
          git add -A output/
          git rm --ignore-unmatch -r --cached remotion/public/audio/ remotion/public/scenes/ 2>/dev/null || true
          git add -f remotion/public/audio/ remotion/public/scenes/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: cleanup posted files [skip ci]"
            for attempt in 1 2 3; do
              git add -A output/
              git rm --ignore-unmatch -r --cached remotion/public/audio/ remotion/public/scenes/ 2>/dev/null || true
              git add -f remotion/public/audio/ remotion/public/scenes/ 2>/dev/null || true
              if git pull --rebase origin main && git push; then
                echo "Cleanup committed (attempt $attempt)"
                break
              fi
              echo "Cleanup push failed attempt $attempt; retrying..."
              sleep 5
            done
          fi

      - name: Upload post log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: post-log-${{ github.run_id }}
          path: output/final/post_*.json
          retention-days: 30

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Daily post failed"
          BODY="## Daily Post Failed\n\n**Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n**Time:** $(date -u)\n\nThe daily post workflow failed. A video was not posted to Facebook/Instagram.\n\n**Action required:** Check the run logs — likely a token expiry or API error."
          EXISTING="$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title == "Daily post failed") | .number' | head -n 1)"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close alert after success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING="$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title == "Daily post failed") | .number' | head -n 1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Daily post succeeded on run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Issue auto-closed."
            gh issue close "$EXISTING" --reason completed
          fi
