name: Refresh FB Token

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours — keeps token fresh, reduces expiry window
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh Facebook token
        env:
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_LONG_LIVED_USER_TOKEN: ${{ secrets.FB_LONG_LIVED_USER_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -c "from modules.token_refresher import run_token_refresh; import json; print(json.dumps(run_token_refresh(), indent=2))"

      - name: Commit refresh log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/final/ --force
          git diff --staged --quiet || git commit -m "chore: fb token refreshed [skip ci]"
          git push

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="FB token refresh failed"
          BODY="## FB Token Refresh Failed\n\n**Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n**Time:** $(date -u)\n\nThe Facebook token could not be refreshed. Posting and analytics will fail until the token is renewed.\n\n**Action required:**\n1. Go to [Graph Explorer](https://developers.facebook.com/tools/explorer)\n2. Generate a new short-lived token for the **PawFacts Poster** app\n3. Run locally: `python3 -c \"from modules.token_refresher import bootstrap_from_short_token; bootstrap_from_short_token('YOUR_TOKEN')\"`"
          EXISTING="$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title == "FB token refresh failed") | .number' | head -n 1)"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close alert after success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING="$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title == "FB token refresh failed") | .number' | head -n 1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Token refresh succeeded on run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Issue auto-closed."
            gh issue close "$EXISTING" --reason completed
          fi
