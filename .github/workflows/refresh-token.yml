name: Refresh FB Token

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours — keeps token fresh, reduces expiry window
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh Facebook token
        env:
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_LONG_LIVED_USER_TOKEN: ${{ secrets.FB_LONG_LIVED_USER_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -c "from modules.token_refresher import run_token_refresh; import json; print(json.dumps(run_token_refresh(), indent=2))"

      - name: Commit refresh log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/final/ --force
          git diff --staged --quiet || git commit -m "chore: fb token refreshed [skip ci]"
          git push

      - name: Remind on failure
        if: failure()
        run: |
          echo "::error::FB token refresh failed. Manually refresh at https://developers.facebook.com/tools/explorer and update the FB_ACCESS_TOKEN GitHub Secret."
