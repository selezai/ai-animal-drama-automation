name: Refresh FB Token

on:
  schedule:
    - cron: '0 8 1 * *'  # 1st of every month at 08:00 UTC = 10:00 SAST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh Facebook token
        env:
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -c "from modules.token_refresher import run_token_refresh; import json; print(json.dumps(run_token_refresh(), indent=2))"

      - name: Commit refresh log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/final/ --force
          git diff --staged --quiet || git commit -m "chore: fb token refreshed [skip ci]"
          git push

      - name: Alert on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.ALERT_EMAIL_USER }}
          password: ${{ secrets.ALERT_EMAIL_PASS }}
          to: ${{ secrets.ALERT_EMAIL_USER }}
          from: PawFacts Pipeline
          subject: "FAILED: FB Token Refresh - action required"
          body: |
            The monthly Facebook token refresh failed.
            Your FB_ACCESS_TOKEN may expire soon and posting will stop.

            Action required: manually refresh the token at
            https://developers.facebook.com/tools/explorer

            View the failed run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
