name: Collect Analytics

on:
  schedule:
    - cron: '0 11 * * *'  # 11:00 UTC = 13:00 SAST, before weekly batch generation
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  collect-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: repo-state-writes
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Collect analytics
        id: collect
        continue-on-error: true
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python main.py analytics

      - name: Update analytics health
        id: health
        if: always()
        env:
          ANALYTICS_STEP_OUTCOME: ${{ steps.collect.outcome }}
        run: python scripts/update_analytics_health.py

      - name: Commit analytics state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/analytics/post_metrics.json output/analytics/content_scores.json output/analytics/health.json
          git diff --staged --quiet || git commit -m "chore: update analytics feedback [skip ci]"
          git push

      - name: Notify repeated analytics problems
        if: always() && steps.health.outputs.notification_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.health.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.health.outputs.issue_body_path }}
        run: |
          ISSUE_NUMBER="$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title == "Analytics feedback loop needs attention") | .number' | head -n 1)"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --body-file "$ISSUE_BODY"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$ISSUE_BODY"
          fi

      - name: Close analytics issue after recovery
        if: always() && steps.health.outputs.recovered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title == "Analytics feedback loop needs attention") | .number' | head -n 1)"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Analytics feedback loop recovered. The consecutive problem streak is back to 0."
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi

      - name: Fail workflow if analytics command failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
