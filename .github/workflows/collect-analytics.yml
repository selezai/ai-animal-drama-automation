name: Collect Analytics

on:
  schedule:
    - cron: '0 11 * * *'  # 11:00 UTC = 13:00 SAST, before weekly batch generation
  workflow_dispatch:

jobs:
  collect-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: repo-state-writes
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Collect analytics
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python main.py analytics

      - name: Commit analytics state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/analytics/ --force
          git diff --staged --quiet || git commit -m "chore: update analytics feedback [skip ci]"
          git push
