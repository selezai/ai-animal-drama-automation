name: Engage Comments

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: '30 5 * * *'   # 05:30 UTC = 07:30 SAST (30min after morning post)
    - cron: '30 16 * * *'  # 16:30 UTC = 18:30 SAST (30min after evening post)
  workflow_dispatch:

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Reply to comments
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python main.py reply || echo "Comment reply failed — no new comments or API error, continuing"

      - name: Commit reply logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/final/ output/replied/ --force
          git diff --staged --quiet || git commit -m "chore: comment replies [skip ci]"
          git push

      - name: Upload reply log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: reply-log-${{ github.run_id }}
          path: output/final/replies_*.json
          retention-days: 14

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Comment engagement workflow failed"
          BODY="## Comment Engagement Failed\n\n**Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n**Time:** $(date -u)\n\nThe comment reply workflow failed unexpectedly.\n\n**Action required:** Check the run logs — likely a token or API error."
          EXISTING="$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title == "Comment engagement workflow failed") | .number' | head -n 1)"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close alert after success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING="$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title == "Comment engagement workflow failed") | .number' | head -n 1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Comment engagement succeeded on run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Issue auto-closed."
            gh issue close "$EXISTING" --reason completed
          fi
