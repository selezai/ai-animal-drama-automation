name: Weekly Batch Generate

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: '0 18 * * 0'  # Sunday 18:00 UTC = 20:00 SAST
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of videos to generate'
        required: false
        default: '14'

jobs:
  batch-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: batch-generate
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg chromium-browser
          echo "REMOTION_CHROME_EXECUTABLE=$(which chromium-browser)" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm install

      - name: Run batch generation
        id: batch
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ALLOW_FALLBACK_SCENES: ${{ vars.ALLOW_FALLBACK_SCENES }}
        run: |
          COUNT=${{ github.event.inputs.count || '14' }}
          python main.py batch --count=$COUNT

      - name: Commit rendered videos to queue
        if: always()
        run: |
          python3 -c "from modules.queue_manager import purge_stale; n=purge_stale(); print(f'Purged {n} stale manifests')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output/queue output/video output/history remotion/public/audio remotion/public/scenes
          git add -A output/queue/ output/video/ output/history/
          git add -f remotion/public/audio/ remotion/public/scenes/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: add $(ls output/queue/*.json 2>/dev/null | wc -l | tr -d ' ') videos to queue [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push failed on attempt $attempt; retrying after rebase"
            sleep 10
          done
          echo "Failed to push batch queue state after 3 attempts"
          exit 1

      - name: Upload batch log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: batch-log-${{ github.run_id }}
          path: output/final/batch_*.json
          retention-days: 30

      - name: Fail workflow if batch generation failed
        if: steps.batch.outcome == 'failure'
        run: |
          echo "Batch generation had one or more failed tips after committing recoverable outputs."
          exit 1

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Weekly batch generation failed"
          BODY="## Weekly Batch Generation Failed\n\n**Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n**Time:** $(date -u)\n\nThe weekly batch failed to generate new videos. The posting queue may run dry.\n\n**Action required:** Check the run logs and re-trigger manually from the Actions tab."
          EXISTING="$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title == "Weekly batch generation failed") | .number' | head -n 1)"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close alert after success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING="$(gh issue list --state open --limit 50 --json number,title --jq '.[] | select(.title == "Weekly batch generation failed") | .number' | head -n 1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Batch generation succeeded on run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Issue auto-closed."
            gh issue close "$EXISTING" --reason completed
          fi
