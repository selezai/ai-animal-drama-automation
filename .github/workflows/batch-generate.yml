name: Weekly Batch Generate

on:
  schedule:
    - cron: '0 18 * * 0'  # Sunday 18:00 UTC = 20:00 SAST
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of videos to generate'
        required: false
        default: '14'

jobs:
  batch-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg chromium-browser
          echo "REMOTION_CHROME_EXECUTABLE=$(which chromium-browser)" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm install

      - name: Run batch generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          COUNT=${{ github.event.inputs.count || '14' }}
          python main.py batch --count=$COUNT

      - name: Commit rendered videos to queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/queue/ output/video/ remotion/public/audio/ remotion/public/scenes/ --force
          git diff --staged --quiet || git commit -m "chore: add $(ls output/queue/*.json 2>/dev/null | wc -l | tr -d ' ') videos to queue [skip ci]"
          git push

      - name: Upload batch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-log-${{ github.run_id }}
          path: output/final/batch_*.json
          retention-days: 30
